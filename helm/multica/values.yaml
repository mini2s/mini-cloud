# Default values for multica.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Namespace all chart resources are deployed into.
# Defaults to costrict-web. Set to "" to fall back to the release namespace
# (the `helm -n <ns>` flag), e.g. `--set namespace=""` with `-n my-ns`.
namespace: costrict-web

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

backend:
  replicaCount: 1

  image:
    repository: ghcr.io/askhz/multica-backend
    pullPolicy: IfNotPresent
    tag: "0.0.1"

  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}

  service:
    type: ClusterIP
    port: 8080

  config:
    port: "8080"
    appEnv: "production"
    corsAllowedOrigins: ""
    frontendOrigin: ""
    allowSignup: "true"
    allowedEmails: []
    allowedEmailDomains: []
    publicURL: ""
    trustedProxies: []
    rateLimitTrustedProxies: []
    realtimeMetricsToken: ""
    multicaCloudFleetUrl: ""
    multicaFleetUrl: ""
    redisUrl: ""
    realtimeRelayMode: ""
    realtimeRelayShards: ""
    realtimeRelayStreamMaxLen: ""
    realtimeRelayXreadCount: ""
    realtimeRelayXreadBlock: ""
    metricsAddr: ""
    posthogApiKey: ""
    posthogHost: ""
    analyticsDisabled: "false"
    analyticsEnvironment: ""
    localUploadDir: ""
    localUploadBaseUrl: ""
    s3Bucket: ""
    s3Region: ""
    awsEndpointUrl: ""
    cloudfrontDomain: ""
    multicaDevVerificationCode: ""
    # Casdoor SSO (optional; leave empty to disable SSO login).
    casdoorEndpoint: ""
    casdoorPublicEndpoint: ""
    casdoorRedirectUri: ""
    casdoorOrgName: ""
    casdoorAppName: ""
    casdoorClientId: ""
    casdoorLoginUrl: ""
    # dept-sync integration. BaseURL defaults to the in-cluster costrict-dept-sync
    # service (namespace costrict, port 8080). Set deptSyncQueryKey to enable
    # dept-backed member management; leave both empty to disable.
    deptSyncBaseUrl: "http://costrict-dept-sync-svc.costrict:8080/costrict-dept-info/api/v1"
    deptSyncTimeout: "10s"
    deptSyncCacheTtl: "1m"
    deptLinkTimeout: "15s"
    deptLinkInterval: "5m"
    # CSC plugin marketplace — optional. Override the marketplace the daemon
    # registers against when installing a CSC agent's bound plugin; when empty
    # the daemon falls back to its built-in github default (costrict-plugins).
    # The plugin install path also needs BUILTIN_PLUGIN_API_BASE_URL set (e.g.
    # via backend.extraEnv); it is intentionally not exposed here.
    cscPluginMarketplaceName: ""
    cscPluginMarketplaceRepo: ""
    # Gitea — backs the workflow deliverable feature: document deliverables are
    # stored in per-workspace Gitea repos. Leave all empty to keep the feature
    # dormant (server reports isGiteaConfigured=false). Enable by setting
    # giteaBaseUrl + giteaAdminToken (below in backend.secrets). Set
    # giteaPublicBaseUrl to a daemon/agent-reachable clone URL when the
    # in-cluster giteaBaseUrl is not resolvable from where daemons run.
    giteaBaseUrl: ""
    giteaPublicBaseUrl: ""
    # Workflow role-to-member resolution. Keep disabled until the organization
    # integration and workflowRoleLlmApiKey secret are configured.
    workflowRoleResolutionEnabled: "false"
    workflowRoleResolutionWorkspaceAllowlist: []
    workflowRoleLlmProvider: "openai"
    workflowRoleLlmModel: "glm-4-plus"
    workflowRoleLlmBaseUrl: "https://open.bigmodel.cn/api/paas/v4"
    workflowRoleLlmMaxOutputTokens: "4096"
    workflowRoleLlmTemperature: "0"
    workflowRoleLlmTimeoutSeconds: "30"
    workflowRoleLlmMaxCandidates: "200"
    workflowRoleLlmMaxSlots: "50"
    workflowRoleLlmMaxInputChars: "100000"
    workflowRoleWorkerConcurrency: "2"
    workflowRoleMaxActiveJobsPerWorkspace: "5"

  persistence:
    enabled: false
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    mountPath: /app/data/uploads
    annotations: {}

  secrets:
    databaseUrl: ""
    jwtSecret: ""
    resendApiKey: ""
    smtpHost: ""
    smtpPort: ""
    smtpUser: ""
    smtpPassword: ""
    smtpFrom: ""
    awsAccessKeyId: ""
    awsSecretAccessKey: ""
    openaiApiKey: ""
    anthropicApiKey: ""
    casdoorClientSecret: ""
    deptSyncQueryKey: ""
    workflowRoleLlmApiKey: ""
    giteaAdminToken: ""

  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  volumes: []
  volumeMounts: []
  extraEnv: []

  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: ""

web:
  replicaCount: 1

  image:
    repository: ghcr.io/askhz/multica-web
    pullPolicy: IfNotPresent
    tag: "0.0.1"

  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}

  service:
    type: ClusterIP
    port: 3000

  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  volumes: []
  volumeMounts: []
  # Subpath deployment: set NEXT_PUBLIC_API_URL so API requests go to
  # /multica-backend/* and NEXT_PUBLIC_BASE_PATH for the web subpath.
  # The proxy layer (e.g. Nginx) routes /multica-backend/* directly to
  # the backend service; Next.js rewrite is not needed.
  # extraEnv:
  #   - name: NEXT_PUBLIC_BASE_PATH
  #     value: "/multica-web"
  #   - name: NEXT_PUBLIC_API_URL
  #     value: "/multica-backend"
  extraEnv: []

  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Example: subpath deployment with separate routes for web and backend
  # hosts:
  #   - host: zgsmtest.cn
  #     paths:
  #       - path: /multica-web
  #         pathType: Prefix
  #         service: web
  #       - path: /auth
  #         pathType: Prefix
  #         service: backend
  #       - path: /api
  #         pathType: Prefix
  #         service: backend
  #       - path: /ws
  #         pathType: Prefix
  #         service: backend
  #       - path: /uploads
  #         pathType: Prefix
  #         service: backend
  hosts: []
  tls: []
