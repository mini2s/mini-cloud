version: "2"
sql:
  - engine: "postgresql"
    queries: "pkg/db/queries/"
    schema:
      - "migrations/"
      # Generation-only stub for tables owned by external services (cs-user)
      # that share the database in cloud deployments. Never applied.
      - "pkg/db/schema_external.sql"
    gen:
      go:
        package: "db"
        out: "pkg/db/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
